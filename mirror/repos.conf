# repo  upstream (pacoloco)  mirror dir (under ~/Work/btrpkg-repo, caddy's root)  keyring  wanted list
#   btrparts directory, relative to the mirror dir: shared by the repositories and architectures
#   of one mirror (the database tells clients, btrpkg.parts)
omarchy http://127.0.0.1:9129/repo/omarchy-edge-x86_64      omarchy-mirror/x86_64         /usr/share/pacman/keyrings/omarchy.gpg   wanted.txt    ../btrparts
core    http://127.0.0.1:9129/repo/archlinux/core/os/x86_64  arch-mirror/core/os/x86_64    /usr/share/pacman/keyrings/archlinux.gpg core.wanted   ../../../btrparts
extra   http://127.0.0.1:9129/repo/archlinux/extra/os/x86_64 arch-mirror/extra/os/x86_64   /usr/share/pacman/keyrings/archlinux.gpg extra.wanted  ../../../btrparts
# aarch64 beside x86_64, sharing the btrparts directories (Arch Linux ARM's core, extra and alarm,
# and asahi-alarm, as Omarchy's aarch64 machines use them; keyrings relative to mirror/, from
# archlinuxarm-keyring and asahi-alarm-keyring). *-aarch64.wanted: the x86_64 list plus what
# macmini-m1 and galaxybook have installed from that repository (2026-11-22). asahi-alarm sits
# under arch-mirror too, so one `Server = .../arch-mirror/$repo/os/$arch` serves all of them.
omarchy http://127.0.0.1:9129/repo/omarchy-edge-aarch64     omarchy-mirror/aarch64        /usr/share/pacman/keyrings/omarchy.gpg   omarchy-aarch64.wanted    ../btrparts
core    http://127.0.0.1:9129/repo/archlinuxarm/aarch64/core arch-mirror/core/os/aarch64   keyrings/archlinuxarm.gpg                core-aarch64.wanted   ../../../btrparts
extra   http://127.0.0.1:9129/repo/archlinuxarm/aarch64/extra arch-mirror/extra/os/aarch64 keyrings/archlinuxarm.gpg                extra-aarch64.wanted  ../../../btrparts
alarm   http://127.0.0.1:9129/repo/archlinuxarm/aarch64/alarm arch-mirror/alarm/os/aarch64 keyrings/archlinuxarm.gpg                alarm.wanted  ../../../btrparts
asahi-alarm https://github.com/asahi-alarm/asahi-alarm/releases/download/aarch64 arch-mirror/asahi-alarm/os/aarch64 keyrings/asahi-alarm.gpg asahi-alarm.wanted ../../../btrparts
