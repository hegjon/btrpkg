[package]
name = "btrpkg"
version = "0.0.1"
edition = "2021"
description = "Spike: pacman packages whose file data is stored as btrfs compressed extents"
license = "MIT"

[dependencies]
anyhow = "1"
libc = "0.2"
rayon = "1"
sha2 = "0.10"
tar = "0.4"
zstd = "0.13"

[profile.release]
lto = true
codegen-units = 1
debug = false
