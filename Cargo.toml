[package]
name = "btrpkg"
version = "0.0.1"
edition = "2021"
description = "Spike: pacman packages whose file data is stored as btrfs compressed extents"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
curl = "0.4.51"
ed25519-dalek = "2"
flate2 = "1.1.11"
landlock = "0.4.8"
libc = "0.2"
rayon = "1"
sha2 = "0.10"
tar = "0.4"
zstd = { version = "0.13", features = ["zstdmt"] }

[profile.release]
lto = true
codegen-units = 1
debug = false
