#
# /etc/pacman-btrpkg.conf: the configuration pacman-btrpkg reads by default.
#
# It is the system's pacman.conf plus BtrPkgHelper: repositories, options and hooks stay in one
# place. Sync packages whose database entry carries btrpkg data (btrpkg.index, btrpkg.id) are
# downloaded and installed as btrpkg packages; everything else exactly as pacman does.
#
[options]
BtrPkgHelper = /usr/bin/btrpkg
Include = /etc/pacman.conf
